<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Money Goes | So Good</title>
<meta name="description" content="How the money from every So Good shirt is used.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<script src="/content.js"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-head">
  <div class="wrap">
    <h1 data-text="money.headline"></h1>
    <p data-text="money.intro"></p>
  </div>
</section>
<section class="section">
  <div class="wrap split">
    <div>
      <h2>the breakdown</h2>
      <p class="muted">How one tee splits up.</p>
    </div>
    <div data-money></div>
  </div>
</section>
<section class="section section-paper">
  <div class="wrap split">
    <div>
      <h2>our promise</h2>
      <p class="lead measure" data-text="money.promise"></p>
    </div>
    <div>
      <p class="kicker">Updates</p>
      <div data-updates></div>
    </div>
  </div>
</section>

<section class="section section-dark on-dark">
  <div class="wrap notify">
    <div>
      <h2>be first in line.</h2>
      <p class="lead">Shirts are almost ready. Leave your email and we'll tell you the day they go on sale.</p>
    </div>
    <div>
      <form class="notify-form" data-notify>
        <label class="sr-only" for="notify-email">Your email</label>
        <input id="notify-email" type="email" placeholder="Your email" required>
        <button class="btn" type="submit">Get notified</button>
      </form>
      <p class="small">This opens an email to us for now. A real sign-up list is coming soon.</p>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
