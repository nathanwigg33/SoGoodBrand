<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story | So Good</title>
<meta name="description" content="Why So Good exists: his story, life after a brain injury, and where the money goes.">
<meta name="theme-color" content="#F7F4EE">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<script src="/content.js"></script>
<script src="/assets/shirt.js"></script>
</head>
<body>
<div id="announce"></div>
<header id="site-header"></header>
<main>
<section class="story-hero">
  <div class="wrap">
    <p class="eyebrow">Our story</p>
    <h1 data-text="purposeStatement.headline"></h1>
    <p>So Good is a clothing brand built around one person's favorite words, and the people we want to help with them.</p>
  </div>
</section>

<section class="section">
  <div class="wrap split">
    <div><div data-photo></div><p class="caption" data-text="person.photoCaption"></p></div>
    <div class="prose" data-paras="person.story"><h2>Meet <span data-text="person.name"></span></h2></div>
  </div>
</section>

<section class="section" style="background:var(--sand)">
  <div class="wrap split">
    <h2 data-text="brainInjury.headline" style="font-size:clamp(2.2rem,4vw,3.4rem)"></h2>
    <div class="prose" data-paras="brainInjury.paragraphs"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="head"><h2 data-text="purpose.headline"></h2></div>
    <div data-points></div>
  </div>
</section>

<section class="section" id="money" style="border-top:1px solid var(--line)">
  <div class="wrap split">
    <div>
      <h2 data-text="money.headline" style="font-size:clamp(2.2rem,4vw,3.4rem)"></h2>
      <p class="muted" data-text="money.intro"></p>
    </div>
    <div>
      <p style="margin:0">How the price of one tee splits up</p>
      <div data-money></div>
      <p style="margin-top:2rem" data-text="money.promise"></p>
      <div data-updates></div>
    </div>
  </div>
</section>

<section class="section" style="border-top:1px solid var(--line)">
  <div class="wrap">
    <div class="head"><h2>Things he says</h2></div>
    <div data-quotes></div>
  </div>
</section>

<section class="quote-band">
  <div class="wrap">
    <blockquote>Wear the words.</blockquote>
    <p>Every piece helps.</p>
    <a class="btn btn-light" href="/shop">Shop the collection</a>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
