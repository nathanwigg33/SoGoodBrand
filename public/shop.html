<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | So Good</title>
<meta name="description" content="Shop So Good tees and crewnecks. Part of every piece supports brain injury recovery.">
<meta name="theme-color" content="#F7F4EE">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<script src="/content.js"></script>
<script src="/assets/shirt.js"></script>
</head>
<body>
<div id="announce"></div>
<header id="site-header"></header>
<main>
<section class="page-head">
  <div class="wrap">
    <h1 id="shop-title">Shop all</h1>
    <p>Simple pieces with the words he says every day.</p>
  </div>
</section>
<section class="section" style="padding-top:1rem">
  <div class="wrap"><div data-grid data-tabs data-three></div></div>
</section>

<section class="section" id="newsletter" style="border-top:1px solid var(--line)">
  <div class="wrap newsletter">
    <div>
      <h2>Be the first to know.</h2>
      <p>The first collection is almost here. Join the list and we'll email you the day it drops.</p>
    </div>
    <div>
      <form class="field" data-notify>
        <label class="sr-only" for="nl-email">Email address</label>
        <input id="nl-email" type="email" placeholder="Email address" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="fine">For now this opens an email to us. A real sign-up list is coming soon.</p>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
