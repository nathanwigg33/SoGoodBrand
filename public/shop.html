<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | So Good</title>
<meta name="description" content="So Good tees and crewnecks. Every shirt supports a brain injury survivor.">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bagel-fat-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<script src="/content.js"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-head sun">
  <div class="wrap">
    <h1>The shirts</h1>
    <p>Simple shirts with the words he says every day. Coming soon. Tap any shirt to pick your color and size.</p>
  </div>
</section>
<section class="section">
  <div class="wrap"><div data-shirts></div></div>
</section>

<section class="section section-ink">
  <div class="wrap notify">
    <div>
      <h2>Be first in line.</h2>
      <p class="lead">Shirts are almost ready. Leave your email and we'll tell you the day they go on sale.</p>
    </div>
    <div>
      <form class="notify-form" data-notify>
        <label class="sr-only" for="notify-email">Your email</label>
        <input id="notify-email" type="email" placeholder="you@email.com" required>
        <button class="btn btn-sun" type="submit">Get notified</button>
      </form>
      <p class="small">This opens an email to us for now. A real sign-up list is coming soon.</p>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
