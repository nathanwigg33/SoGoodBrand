<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Purpose | So Good</title>
<meta name="description" content="Why So Good exists: his story and the people we want to help.">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bagel-fat-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<script src="/content.js"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-head">
  <div class="wrap">
    <h1 data-text="purpose.headline"></h1>
    <p>So Good is a shirt brand built around one person's favorite words, and the people we want to help with them.</p>
  </div>
</section>
<section class="section">
  <div class="wrap split">
    <div><div data-photo></div><p class="caption" data-text="person.photoCaption"></p></div>
    <div>
      <h2>Meet <span data-text="person.name"></span></h2>
      <div class="measure lead" data-story></div>
    </div>
  </div>
</section>
<section class="section section-sky">
  <div class="wrap">
    <div class="section-head"><h2>What we're here to do</h2></div>
    <ul data-points class="measure"></ul>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <div class="section-head"><h2>Things he says</h2></div>
    <div data-quotes></div>
  </div>
</section>
<section class="section section-sun">
  <div class="wrap section-head">
    <h2>Wear the words.</h2>
    <div class="btn-row"><a class="btn" href="/shop">Shop the shirts</a><a class="btn btn-light" href="/money">Where the money goes</a></div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
